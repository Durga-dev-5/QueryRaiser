<!DOCTYPE html>
<html>
    <head>

        <title>HR/Manager Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
body {
    margin: 0;
    padding: 20px;
    text-align: center;
    background-color: rgb(159, 252, 221);
    font-family: 'Segoe UI', sans-serif;
}

.table-container {
    width: 100%;
    overflow-x: auto;
    margin: 20px auto;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid black;
    word-break: break-word;
}

button {
    padding: 10px;
    background: linear-gradient(to right,#00c6ff,#0072ff);
    color: white;
    border: none;
    border-radius: 8px;
}

@media screen and (max-width: 600px) {
    body {
        padding: 12px;
    }

    h1 {
        font-size: 25px;
    }

    .table-container {
        overflow-x: auto;
    }
}
        </style>
    </head>
    <body>
        <div class="table-container">
    <table border="1" cellspacing="0">
            <thead>
              <tr>
                <th>Employee Name</th>
                <th>Employee Email</th>
                <th>Department</th>
                <th>Subject</th>
                <th>Description</th>              
                <th>Status</th>
                <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="tabledata"></tbody>
    </table>
</div>
        <a href="index.html">Home</a>
    </body>
<script>
function getData() {
    try {
        return JSON.parse(localStorage.getItem("empuser")) || [];
    } catch (e) {
        console.error("Invalid JSON data");
        return [];
    }
}

function displayQuery() {
    let data = getData();
    let table = document.getElementById("tabledata");

    table.innerHTML = "";

    if (data.length === 0) {
        table.innerHTML = `<tr><td colspan="7">No queries found</td></tr>`;
        return;
    }

    data.forEach((e, index) => {
        table.innerHTML += `
            <tr>
                <td>${e.empname || ""}</td>
                <td>${e.empmail || ""}</td>
                <td>${e.empdep || ""}</td>
                <td>${e.subject || ""}</td>
                <td>${e.equeries || ""}</td>
                <td>${e.status || "Pending"}</td>
                <td>
                    <button onclick="resolveQuery(${index})">
                        Resolve
                    </button>
                </td>
            </tr>
        `;
    });
}

function resolveQuery(index) {
    let data = getData();
    if (!data[index]) return;
    data[index].status = "Resolved";
    localStorage.setItem("empuser", JSON.stringify(data));
    displayQuery();
}
// Load data when page opens
window.onload = displayQuery;
</script>
