<!DOCTYPE html>
<html>
    <head>
        <title>Employee Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
    margin:0;
    padding:0;

    font-family:'Segoe UI',sans-serif;

    background:#f4f4f4;
}

/* COMPANY TITLE */

h1{
    text-align:center;

    color:#222;

    margin-top:25px;

    font-size:40px;

    text-shadow:2px 2px 10px lightgray;
}

/* LOGO */

.logo{
    position:fixed;

    top:15px;

    left:20px;

    z-index:1000;
}

.logo img{
    width:75px;
}

/* DASHBOARD BOX */

.container{

    width:470px;

    margin:40px auto;

    padding:30px;

    background:white;

    border-radius:20px;

    box-shadow:0px 8px 25px rgba(0,0,0,0.15);

    box-sizing:border-box;
}

/* HEADING */

h2{

    text-align:center;

    color:#222;

    margin-bottom:25px;
}

/* LABELS */

label{

    display:block;

    font-weight:bold;

    color:#222;

    margin-bottom:8px;
}

/* INPUTS */

input[type="text"],
input[type="email"],
select,
textarea{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:15px;

    box-sizing:border-box;
}

/* TEXTAREA */

textarea{

    resize:none;
}

/* FOCUS EFFECT */

input:focus,
select:focus,
textarea:focus{

    outline:none;

    border:2px solid #007bff;
}

/* BUTTONS */

button{

    padding:12px 16px;

    border:none;

    border-radius:10px;

    background:linear-gradient(to right,#00c6ff,#0072ff);

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    margin-right:10px;

    margin-top:10px;
}

/* BUTTON HOVER */

button:hover{

    transform:translateY(-2px);

    background:linear-gradient(to right,#0072ff,#00c6ff);
}

/* HISTORY SECTION */

#historySection{

    width:470px;

    margin:20px auto;

    background:white;

    padding:20px;

    border-radius:20px;

    box-shadow:0px 8px 25px rgba(0,0,0,0.15);

    box-sizing:border-box;
}
/* RESPONSIVE DESIGN */

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    min-width: 0;
}

/* MOBILE VIEW */

@media screen and (max-width: 600px) {

    body {
        padding: 15px;
    }

    h1 {
        font-size: 28px;
        margin-top: 65px;
        margin-bottom: 20px;
    }

    .logo {
        top: 10px;
        left: 10px;
    }

    .logo img {
        width: 50px;
    }

    button {
        max-width: 100%;
        font-size: 15px;
    }

    input,
    select,
    textarea {
        max-width: 100%;
        font-size: 16px;
    }
}
@media screen and (max-width: 600px) {

    .container {
        width: 100%;
        max-width: 470px;
        padding: 22px 18px;
        margin: 20px auto;
    }

    #historySection {
        width: 100%;
        max-width: 470px;
        margin: 20px auto;
        padding: 15px;
    }

    .container button {
        width: 100%;
        margin: 8px 0;
    }

    textarea {
        width: 100%;
    }
}
        </style>
        <script>
            function raisequery(){
    let empname=document.getElementById("empname").value
    //localStorage.setItem("empname",empname)
    let empmail=document.getElementById("empid").value
    //localStorage.setItem("empid",empmail)
    let empdep=document.getElementById("depart").value
    //localStorage.setItem("depart",empdep)
    let subject=document.getElementById("Qsub").value
    //localStorage.setItem("Qsub",subject)
    let equeries=document.getElementById("querydes").value
    //localStorage.setItem("querydes",equeries)
    if(empname==""||empmail==""||empdep==""||subject==""||equeries=="")
        {
            alert("Please the enter the all fields")
            return;
        }
        
       let empuser=JSON.parse(localStorage.getItem("empuser"))||[];
       empuser.push({
        empname,
        empmail,
        empdep,
        subject,
        equeries,
        status:"pending"
       });
       localStorage.setItem("empuser", JSON.stringify(empuser))
       alert("Query submitted successfully!")
    }
function showHistory() {

    let data = JSON.parse(localStorage.getItem("empuser")) || [];

    let currentEmail = document.getElementById("empid").value.trim();

    let historyDiv = document.getElementById("historySection");

    if (currentEmail === "") {
        alert("Please enter your email ID");
        return;
    }

    let userQueries = data.filter(item =>
        item.empmail === currentEmail
    );

    if (userQueries.length === 0) {
        historyDiv.innerHTML = "<p>No previous queries found.</p>";
        return;
    }

    let output = "<h3>My Previous Queries</h3>";

    userQueries.forEach((item) => {

        output += `
            <div style="border:1px solid black; margin:10px; padding:10px;">
                <p><b>Subject:</b> ${item.subject}</p>
                <p><b>Query:</b> ${item.equeries}</p>
                <p><b>Status:</b> ${item.status}</p>
            </div>
        `;
    });

    historyDiv.innerHTML = output;
}

        </script>
    </head>
    <body>
        <h1>Tech Company</h1>
        <div class="logo">
            <img src="logo img.png" alt="compamy logo">
        </div>
        <div class="container">
            <h2>Raise your Queries</h2>
           <label for="Name">Name</label><br>
            <input type="text" name="Name" id="empname" placeholder="Enter your Name" required><br>
            <label for="email">Email ID</label><br>
            <input type="email" name="email" id="empid" placeholder="Enter your Email ID" required><br>
             <label for="Department">Department</label><br>
            <select name="Department" id="depart">
                <option value="select" hidden>Select</option>
                <option value="Testing">Testing</option>
                <option value="Developer">Developer</option>
                <option value="Marketing">Marketing</option>
                <option value="sales">sales</option></select><br>
            <label for="Querysub">Query Subject</label><br>
            <select name="Querysub" id="Qsub">
                <option value="select" hidden>Select</option>
                <option value="Salary">Salary</option>
                <option value="Food">Food</option>
                <option value="projects">projects</option>
                <option value="environment">environment</option>
                <option value="Others">Others</option></select><br>
            <label for="Querydescription">Query Description</label><br>
            <textarea name="Querydescription" id="querydes" rows="5" cols="40"></textarea><br>
            <button type="button" onclick="showHistory()">Previous Query</button>
                <button type="button" onclick="raisequery()">Submit</button>
                <a href="index.html">
            <button type="submit" onclick="loginfun()">Logout</button></a>
        </div>
        <div id="historySection"></div>
    </body>
</html>
